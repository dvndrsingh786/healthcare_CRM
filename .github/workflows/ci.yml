name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only throwaway values. Real secrets never live in the repository.
      ENVIRONMENT: test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: healthcare_crm
      DB_USER: postgres
      DB_PASSWORD: ci-only-password
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests (each run creates and drops its own database)
        run: pytest -q
      - name: Migrations apply to an empty database
        run: |
          PGPASSWORD=$DB_PASSWORD psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE healthcare_crm"
          python migrate.py
          python migrate.py status
      - name: docs/openapi.json matches the code
        run: |
          python manage.py export-openapi /tmp/openapi.json
          diff -q docs/openapi.json /tmp/openapi.json || (echo "Run: python manage.py export-openapi" && exit 1)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match docs/openapi.json
        run: npm run api:types -- --check
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    # The whole system in a real browser: PostgreSQL + migrations + demo data + API + web app.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: healthcare_crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: healthcare_crm
      DB_USER: postgres
      DB_PASSWORD: ci-only-password
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Database with demo data
        run: |
          python migrate.py
          python seed.py
      - name: Start the API
        run: |
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/health/ready && break; sleep 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and serve the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 4173 --strictPort --host 127.0.0.1 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173 > /dev/null && break; sleep 1; done
      - name: Browser tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs on failure
        if: failure()
        run: tail -n 100 /tmp/api.log /tmp/web.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
